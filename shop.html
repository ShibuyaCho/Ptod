<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — Prepare To Dye</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;background:#0a0402;color:#f2e8d4;min-height:100vh;}

/* ── NAV ── */
nav{background:rgba(10,4,2,.92);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;padding:.9rem 1.5rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(0,185,168,.18);}
.nav-logo{font-family:Pacifico,cursive;color:#f0d060;font-size:1.3rem;text-decoration:none;}
.nav-back{color:rgba(0,210,190,.8);font-size:.82rem;font-weight:900;text-decoration:none;letter-spacing:.06em;}
.nav-back:hover{color:#00d2be;}
.cart-badge{background:#7a1418;color:#fff;border-radius:50px;padding:.15rem .6rem;font-size:.72rem;font-weight:900;margin-left:.5rem;}

/* ── HERO ── */
.hero{text-align:center;padding:3rem 1rem 2rem;}
.hero h1{font-family:Pacifico,cursive;font-size:2.2rem;color:#f0d060;margin-bottom:.4rem;}
.hero p{color:rgba(242,232,212,.6);font-size:.9rem;}

/* ── GRID ── */
.grid{max-width:960px;margin:0 auto;padding:1rem 1rem 4rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.4rem;}

.card{background:rgba(255,255,255,.05);border:1px solid rgba(0,185,168,.18);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.5);}
.card-img{width:100%;aspect-ratio:1;object-fit:cover;}
.card-body{padding:1rem;flex:1;display:flex;flex-direction:column;gap:.5rem;}
.card-name{font-weight:900;font-size:1rem;color:#f2e8d4;}
.card-desc{font-size:.8rem;color:rgba(242,232,212,.55);line-height:1.45;flex:1;}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:.5rem;gap:.5rem;}
.card-price{font-size:1.15rem;font-weight:900;color:#f0d060;}
.stock-badge{font-size:.65rem;font-weight:900;letter-spacing:.06em;padding:.18rem .55rem;border-radius:50px;}
.in-stock{background:rgba(10,120,88,.35);color:#4dffcc;border:1px solid rgba(10,120,88,.5);}
.low-stock{background:rgba(230,126,34,.25);color:#ffb347;border:1px solid rgba(230,126,34,.4);}
.out-stock{background:rgba(192,57,43,.25);color:#ff7675;border:1px solid rgba(192,57,43,.4);}

.buy-btn{padding:.55rem 1.1rem;border-radius:50px;background:#7a1418;color:#fff;border:none;font-family:'Nunito',sans-serif;font-weight:900;font-size:.85rem;cursor:pointer;transition:background .15s;white-space:nowrap;}
.buy-btn:hover:not(:disabled){background:#9a2428;}
.buy-btn:disabled{background:#333;color:#666;cursor:not-allowed;}

.empty-state{grid-column:1/-1;text-align:center;padding:4rem 1rem;color:rgba(242,232,212,.35);font-size:.95rem;}

/* ── MODAL ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;padding:1rem;}
.overlay.active{display:flex;}
.modal{background:#1a0e08;border:1px solid rgba(0,185,168,.25);border-radius:20px;width:min(92vw,480px);max-height:90vh;overflow-y:auto;}
.modal-header{padding:1.3rem 1.5rem;border-bottom:1px solid rgba(0,185,168,.15);display:flex;align-items:center;justify-content:space-between;}
.modal-header h2{font-family:Pacifico,cursive;font-size:1.15rem;color:#f0d060;}
.close-btn{background:none;border:none;color:rgba(242,232,212,.4);font-size:1.4rem;cursor:pointer;line-height:1;}
.modal-body{padding:1.5rem;}
.modal-product{display:flex;gap:1rem;margin-bottom:1.3rem;align-items:center;}
.modal-img{width:72px;height:72px;border-radius:12px;object-fit:cover;flex-shrink:0;}
.modal-product-name{font-weight:900;font-size:.95rem;color:#f2e8d4;}
.modal-product-price{font-size:.85rem;color:#f0d060;margin-top:.2rem;}

.form-group{margin-bottom:1rem;}
.form-group label{display:block;font-size:.75rem;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:rgba(242,232,212,.45);margin-bottom:.35rem;}
.form-group input{width:100%;padding:.65rem .9rem;border-radius:10px;border:1.5px solid rgba(0,185,168,.2);background:rgba(255,255,255,.06);color:#f2e8d4;font-family:'Nunito',sans-serif;font-size:.9rem;outline:none;}
.form-group input:focus{border-color:rgba(0,185,168,.55);}
.qty-row{display:flex;align-items:center;gap:.7rem;}
.qty-btn{width:34px;height:34px;border-radius:50%;background:rgba(0,185,168,.15);border:1px solid rgba(0,185,168,.3);color:#00d2be;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:900;}
.qty-num{font-size:1.1rem;font-weight:900;min-width:24px;text-align:center;}
.order-total{font-size:.82rem;color:rgba(242,232,212,.5);margin-top:.3rem;}
#order-total-val{color:#f0d060;font-weight:900;}

#paypal-button-container{margin-top:1.2rem;}
.paypal-placeholder{background:rgba(255,255,255,.05);border:1px dashed rgba(0,185,168,.2);border-radius:10px;padding:1rem;text-align:center;font-size:.8rem;color:rgba(242,232,212,.35);}

/* ── SUCCESS ── */
.success-screen{display:none;text-align:center;padding:2rem;}
.success-screen.active{display:block;}
.success-icon{font-size:3rem;margin-bottom:.8rem;}
.success-screen h3{font-family:Pacifico,cursive;color:#4dffcc;font-size:1.3rem;margin-bottom:.5rem;}
.success-screen p{font-size:.85rem;color:rgba(242,232,212,.6);margin-bottom:.3rem;}
.success-id{font-size:.72rem;color:rgba(242,232,212,.35);margin-top:.5rem;font-family:monospace;}
.done-btn{margin-top:1.3rem;padding:.65rem 1.8rem;border-radius:50px;background:#0a7858;color:#fff;border:none;font-family:'Nunito',sans-serif;font-weight:900;font-size:.9rem;cursor:pointer;}

/* ── TOAST ── */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);background:#c0392b;color:#fff;padding:.7rem 1.3rem;border-radius:50px;font-size:.85rem;font-weight:900;z-index:300;transition:transform .3s;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/">Prepare To Dye</a>
  <a class="nav-back" href="/">← Back</a>
</nav>

<div class="hero">
  <h1>The Shop</h1>
  <p>Hand-dyed pieces — every one unique. Secure checkout via PayPal.</p>
</div>

<div class="grid" id="product-grid">
  <div class="empty-state">Loading products…</div>
</div>

<!-- PURCHASE MODAL -->
<div class="overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2>Complete Your Order</h2>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">

      <!-- Product summary -->
      <div class="modal-product">
        <img class="modal-img" id="modal-img" src="" alt="">
        <div>
          <div class="modal-product-name" id="modal-name"></div>
          <div class="modal-product-price" id="modal-price"></div>
        </div>
      </div>

      <!-- Customer info -->
      <div id="purchase-form">
        <div class="form-group">
          <label>Your Name</label>
          <input type="text" id="cust-name" placeholder="Jane Smith" autocomplete="name">
        </div>
        <div class="form-group">
          <label>Email (for confirmation)</label>
          <input type="email" id="cust-email" placeholder="jane@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Quantity</label>
          <div class="qty-row">
            <button class="qty-btn" onclick="changeQty(-1)">−</button>
            <span class="qty-num" id="qty-num">1</span>
            <button class="qty-btn" onclick="changeQty(1)">+</button>
          </div>
          <div class="order-total">Total: <span id="order-total-val">$0.00</span></div>
        </div>

        <div id="paypal-button-container"></div>
      </div>

      <!-- Success screen -->
      <div class="success-screen" id="success-screen">
        <div class="success-icon">🎉</div>
        <h3>Order Placed!</h3>
        <p>Thanks for your purchase. A confirmation email is on its way.</p>
        <p style="margin-top:.5rem;font-size:.8rem;color:rgba(242,232,212,.5);">We'll reach out with pickup or shipping details.</p>
        <div class="success-id" id="success-id"></div>
        <button class="done-btn" onclick="closeModal()">Done</button>
      </div>

    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- PayPal JS SDK (sandbox) — client-id loaded dynamically -->
<script>
'use strict';

let products   = [];
let activeProduct = null;
let qty        = 1;
let paypalLoaded = false;

// ── Load PayPal SDK with sandbox client ID from server ──
async function initPayPal(clientId) {
  return new Promise((resolve, reject) => {
    if (document.getElementById('paypal-sdk')) { resolve(); return; }
    const s = document.createElement('script');
    s.id  = 'paypal-sdk';
    s.src = `https://www.paypal.com/sdk/js?client-id=${clientId}&currency=USD`;
    s.onload  = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function fetchClientId() {
  try {
    const r  = await fetch('/api/paypal-client-id');
    const d  = await r.json();
    return d.client_id;
  } catch { return null; }
}

// ── Render products ──
async function loadProducts() {
  try {
    const r = await fetch('/api/products');
    products = await r.json();
  } catch {
    products = [];
  }
  renderGrid();
}

function stockLabel(stock) {
  if (stock <= 0)  return { cls: 'out-stock', text: 'Out of Stock' };
  if (stock <= 3)  return { cls: 'low-stock', text: `Only ${stock} left` };
  return { cls: 'in-stock', text: `${stock} in stock` };
}

function renderGrid() {
  const grid = document.getElementById('product-grid');
  if (!products.length) {
    grid.innerHTML = '<div class="empty-state">No products available right now — check back soon!</div>';
    return;
  }
  grid.innerHTML = products.map(p => {
    const sl       = stockLabel(p.stock || 0);
    const soldOut  = (p.stock || 0) <= 0;
    return `
      <div class="card">
        <img class="card-img" src="${p.image}" alt="${p.name}">
        <div class="card-body">
          <div class="card-name">${p.name}</div>
          <div class="card-desc">${p.description}</div>
          <div class="card-footer">
            <div>
              <div class="card-price">$${parseFloat(p.price).toFixed(2)}</div>
              <span class="stock-badge ${sl.cls}">${sl.text}</span>
            </div>
            <button class="buy-btn" ${soldOut ? 'disabled' : ''} onclick="openModal('${p.id}')">
              ${soldOut ? 'Sold Out' : 'Buy Now'}
            </button>
          </div>
        </div>
      </div>`;
  }).join('');
}

// ── Modal ──
async function openModal(productId) {
  activeProduct = products.find(p => p.id === productId);
  if (!activeProduct) return;
  qty = 1;

  document.getElementById('modal-img').src   = activeProduct.image;
  document.getElementById('modal-name').textContent  = activeProduct.name;
  updateModalPrice();
  document.getElementById('qty-num').textContent = '1';
  document.getElementById('purchase-form').style.display  = '';
  document.getElementById('success-screen').classList.remove('active');
  document.getElementById('paypal-button-container').innerHTML = '';
  document.getElementById('modal').classList.add('active');
  document.body.style.overflow = 'hidden';

  // Mount PayPal buttons
  await mountPayPal();
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  document.body.style.overflow = '';
  activeProduct = null;
}

function updateModalPrice() {
  if (!activeProduct) return;
  const total = (activeProduct.price * qty).toFixed(2);
  document.getElementById('modal-price').textContent = `$${parseFloat(activeProduct.price).toFixed(2)} each`;
  document.getElementById('order-total-val').textContent = `$${total}`;
}

function changeQty(delta) {
  if (!activeProduct) return;
  const maxStock = activeProduct.stock || 1;
  qty = Math.max(1, Math.min(maxStock, qty + delta));
  document.getElementById('qty-num').textContent = qty;
  updateModalPrice();
  // Re-render PayPal button so amount is correct
  document.getElementById('paypal-button-container').innerHTML = '';
  mountPayPal();
}

// ── PayPal button mounting ──
async function mountPayPal() {
  const container = document.getElementById('paypal-button-container');
  if (!window.paypal) {
    container.innerHTML = '<div class="paypal-placeholder">PayPal loading…</div>';
    const clientId = await fetchClientId();
    if (!clientId) {
      container.innerHTML = '<div class="paypal-placeholder">PayPal unavailable (no client ID configured)</div>';
      return;
    }
    try {
      await initPayPal(clientId);
    } catch {
      container.innerHTML = '<div class="paypal-placeholder">Could not load PayPal. Check your connection.</div>';
      return;
    }
  }

  container.innerHTML = '';
  const product = activeProduct;
  const amount  = (product.price * qty).toFixed(2);

  paypal.Buttons({
    style: { layout: 'vertical', color: 'gold', shape: 'pill', label: 'pay' },

    createOrder(data, actions) {
      return actions.order.create({
        purchase_units: [{
          description: product.name,
          amount: { value: amount, currency_code: 'USD' },
        }],
      });
    },

    async onApprove(data, actions) {
      const details = await actions.order.capture();
      const custName  = document.getElementById('cust-name').value.trim();
      const custEmail = document.getElementById('cust-email').value.trim();

      try {
        const r = await fetch('/api/order', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({
            product_id:      product.id,
            quantity:        qty,
            paypal_order_id: details.id,
            customer: { name: custName, email: custEmail },
          }),
        });
        const result = await r.json();
        if (!r.ok || result.error) {
          showToast(result.error || 'Order error — please contact us.');
          return;
        }
        // Update local stock count
        const p = products.find(x => x.id === product.id);
        if (p) p.stock = Math.max(0, (p.stock || 0) - qty);
        renderGrid();

        document.getElementById('purchase-form').style.display = 'none';
        document.getElementById('success-screen').classList.add('active');
        document.getElementById('success-id').textContent = 'Order ID: ' + result.order_id;
      } catch {
        showToast('Network error — your payment went through, please contact us with your PayPal confirmation.');
      }
    },

    onError(err) {
      showToast('PayPal error — please try again.');
      console.error(err);
    },
  }).render('#paypal-button-container');
}

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 4000);
}

// Close modal on overlay click
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// Boot
loadProducts();
</script>
</body>
</html>
